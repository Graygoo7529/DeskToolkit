[package]
name = "desktodo"
version = "0.2.0"
description = "DeskTodo - calm local-first notes and todos"
edition = "2021"

[lib]
name = "desktodo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
